    border: none;
    font-size: 26px;
    color: var(--text-muted);

    margin-bottom: 12px;
    font-size: 20px;
    font-weight: 700;

    padding: 28px 32px;

    border: 1px solid #e5e7eb;
    animation: fadeIn 0.2s ease-out;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

    font-size: 15px;
    text-transform: uppercase;
    letter-spacing: 1.2px;
    font-weight: 700;
    color: var(--text-muted);
    margin-bottom: 6px;
  }

  .old-text {
    font-size: 22px;
    font-weight: 600;
    color: var(--text-dark);
    margin-bottom: 0;
  }

  .category-panel {
    background: var(--green-panel-bg);
    color: var(--green-panel-text);
    padding: 20px 24px;
    border-radius: 14px;
    margin-bottom: 0;
    box-shadow: 0 6px 14px rgba(16, 185, 129, 0.25);
  }

    background: #6b7280;

  }

  .category-name {
    font-size: 22px;
    font-weight: 700;
  }

    color: #4b5563;
    background: #f8fafc;
    padding: 8px 14px;
    border-radius: 8px;

    font-size: 19px;
    color: #374151;
    margin-bottom: 10px;
    line-height: 1.6;
  }

    content: "•";
    position: absolute;
    left: 6px;
    color: #0078d4;
    font-size: 26px;
    line-height: 1;
  }

    text-align: center;
    padding: 60px 40px;

    color: #000;

    border-radius: 4px;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }

const searchInput = document.getElementById('search');
const clearBtn = document.getElementById('clearBtn');
const resultsEl = document.getElementById('results');
const countEl = document.getElementById('count');

function highlightText(text, query) {
  if (!query) return text;
  const regex = new RegExp(`(${query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
  return text.replace(regex, '<mark>$1</mark>');
}

function render() {
  const q = searchInput.value.toLowerCase().trim();
  clearBtn.style.display = q ? 'block' : 'none';

  const matches = data.filter(item => 
    item.old.toLowerCase().includes(q) ||
    item.category.toLowerCase().includes(q) ||
    item.sourceSection.toLowerCase().includes(q) ||
    item.suggestions.some(s => s.toLowerCase().includes(q))
  );

  countEl.innerText = `Showing ${matches.length} match${matches.length === 1 ? '' : 'es'}`;

  if (matches.length === 0) {
    resultsEl.innerHTML = `
      <div class="no-results">
        <h3>No matching adjustments found</h3>
        <p style="margin-top:12px;">Try searching for terms like "Macqlit", "headphones", "timetable", "1:1", or "tutoring".</p>
      </div>`;
    return;
  }

  resultsEl.innerHTML = matches.map(item => {
    const noMatch = item.category === "NO_MATCH";
    return `
    <div class="result-card">
      <div class="source-tag">Section: ${highlightText(item.sourceSection, q)}</div>
      
      <div>
        <div class="section-title">Original Adjustment Wording</div>
        <div class="old-text">${highlightText(item.old, q)}</div>
      </div>

      ${noMatch ? `
      <div class="category-panel no-match-panel">
        <div class="section-title">New Framework Location & Level</div>
        <div class="category-name">The attendance related section is currently under review.</div>
      </div>
      <div>
        <div class="section-title">Note</div>
        <ul class="suggestions-list">
          <li>The attendance related section is currently under review.</li>
        </ul>
      </div>
      ` : `
      <div class="category-panel">
        <div class="section-title">New Framework Location & Level</div>
        <div class="category-name">${highlightText(item.category, q)}</div>
      </div>

      <div>
        <div class="section-title">New Framework Specific Adjustments</div>
        <ul class="suggestions-list">
          ${item.suggestions.map(s => `<li>${highlightText(s, q)}</li>`).join('')}
        </ul>
      </div>
      `}
    </div>
  `;
  }).join('');
}

searchInput.addEventListener('input', render);

clearBtn.addEventListener('click', () => {
  searchInput.value = '';
  searchInput.focus();
  render();
});

render();
</script>
